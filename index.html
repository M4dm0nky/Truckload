<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truckload</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#15181d">
  <meta name="apple-mobile-web-app-title" content="Truckload">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <div id="storage-warning" class="banner banner-warn" hidden></div>
  <div id="tab-warning" class="banner banner-warn" hidden>
    Truckload ist in einem weiteren Tab offen — Änderungen können sich gegenseitig überschreiben.
    <button id="tab-warning-close" class="banner-close" type="button" aria-label="Hinweis schließen">×</button>
  </div>
  <!-- Liegt außerhalb von header.topbar, damit sie auch erreichbar ist, wenn dieser
       (Startbildschirm, kein Plan gewählt) `hidden` ist – siehe #import-btn dort und
       #start-import im Startbildschirm, die beide dieselbe Eingabe auslösen. -->
  <input id="import" type="file" accept=".json,application/json" hidden>
  <section id="start-screen" class="start-screen">
    <div class="start-card">
      <h1>Truckload</h1>
      <p>Lege einen neuen Ladeplan an oder öffne einen vorhandenen.</p>
      <div id="start-actions"></div>
    </div>
  </section>
  <header class="topbar" hidden>
    <strong class="brand">Truckload <span id="app-version" class="version">V 0.7.17</span></strong>
    <span id="save-status" class="save-status" hidden></span>
    <div class="group">
      <select id="plan-select" title="Ladeplan"></select>
      <button id="plan-new">Neu</button>
      <button id="plan-rename">Umbenennen</button>
      <button id="plan-dup">Duplizieren</button>
      <button id="plan-del" class="danger">Löschen</button>
    </div>
    <div class="group">
      <select id="truck-select" title="Fahrzeug"></select>
      <button id="truck-edit">Bearbeiten</button>
      <button id="truck-new">+ Fahrzeug</button>
    </div>
    <div class="group">
      <button id="pack-all" class="primary">Alles neu packen</button>
      <button id="pack-rest">Rest einpacken</button>
      <button id="unload-all" title="Alle Cases zurück nach „Noch nicht geladen“, um von Hand zu laden">Truck entladen</button>
    </div>
    <div class="group seg">
      <button id="mode-2d" class="on">2D</button>
      <button id="mode-3d">3D</button>
    </div>
    <div class="group seg">
      <span class="seg-label">Case-Farbe</span>
      <button id="colors-black" class="on">Schwarz</button>
      <button id="colors-trade">Gewerk</button>
    </div>
    <span class="grow"></span>
    <div class="group">
      <button id="undo" title="Rückgängig (⌘Z)">↶</button>
      <button id="redo" title="Wiederholen (⇧⌘Z)">↷</button>
      <button id="export" title="Alles als JSON-Datei sichern">Sichern</button>
      <button id="import-btn" type="button" title="JSON-Sicherung einlesen">Importieren</button>
      <button id="print">Drucken</button>
    </div>
  </header>
  <main class="layout" hidden>
    <aside id="library" class="panel library"></aside>
    <section class="stage">
      <div id="views2d" class="views2d">
        <figure class="view view-top"><figcaption>Draufsicht <small>Stirnwand links · Tür rechts</small></figcaption><svg id="svg-top"></svg></figure>
        <figure class="view view-side"><figcaption>Seitenansicht <small>von links</small></figcaption><svg id="svg-side"></svg></figure>
        <figure class="view view-rear"><figcaption>Rückansicht <small>von der Tür</small></figcaption><svg id="svg-rear"></svg></figure>
      </div>
      <div id="view3d" class="view3d" hidden></div>
    </section>
    <aside id="inspector" class="panel inspector"></aside>
  </main>
  <dialog id="dlg-case"></dialog>
  <dialog id="dlg-truck"></dialog>
  <dialog id="dlg-wizard"></dialog>
  <dialog id="dlg-truss"></dialog>
  <dialog id="dlg-confirm"></dialog>
  <section id="print-root" class="print-root" aria-hidden="true"></section>
  <script type="module" src="js/app.js"></script>
</body>
</html>
